name: Publish to npm

# Publishes loomlog to npm whenever the version in package.json is bumped on main.
# Auth uses npm Trusted Publishing (OIDC) — no NPM_TOKEN secret required.
# One-time setup is documented in RELEASING.md.

on:
  push:
    branches: [main]

permissions:
  contents: write # create the git tag + GitHub Release
  id-token: write # OIDC token for npm Trusted Publishing + provenance

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted Publishing (OIDC) needs npm >= 11.5.1; setup-node ships an older npm.
      - name: Upgrade npm (OIDC support)
        run: npm install -g npm@latest

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Detect version change
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME@$VERSION is already on npm — nothing to publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Publishing $NAME@$VERSION."
          fi

      - name: Publish to npm (OIDC + provenance)
        if: steps.check.outputs.publish == 'true'
        run: npm publish --provenance --access public

      - name: Tag + GitHub Release
        if: steps.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --title "v$VERSION" --generate-notes
